name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 libgtk-4-bin ffmpeg imagemagick poppler-utils pandoc \
            libreoffice-nogui unar p7zip-full libheif-examples libheif-plugin-x265 ghostscript qpdf file fonts-inter
      - name: Tests (real conversions + GUI smoke test under broadway)
        run: /usr/bin/python3 tests/test_satsuma.py

  deb:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lintian desktop-file-utils
      - run: bash packaging/build-deb.sh
      - run: lintian --fail-on error dist/*.deb
      - run: desktop-file-validate data/*.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: satsuma-deb
          path: dist/*.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
